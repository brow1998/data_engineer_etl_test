name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Build from the real raw data twice and compare
        run: |
          uv run catalog run --output out1
          uv run catalog run --output out2
          diff out1/products.csv out2/products.csv
          diff out1/rejected.csv out2/rejected.csv
